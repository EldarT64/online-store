services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks: [data]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/online-shop
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: 8000
    volumes:
      - uploads:/app/uploads
    networks: [app, data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mongo:
        condition: service_healthy

  seed:
    build: ./backend
    command: ["node", "seed.js"]
    environment:
      MONGO_URI: mongodb://mongo:27017/online-shop
    networks: [data]
    depends_on:
      mongo:
        condition: service_healthy
    profiles: ["seed"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    networks: [edge, app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.250.0/24
  app:
    internal: true
  data:
    internal: true

volumes:
  mongo-data:
  uploads:
